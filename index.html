<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人秋招工作台</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fb;color:#303746;margin:0}.boot{min-height:100vh;display:grid;place-items:center}.box{background:#fff;border:1px solid #e7e9ef;border-radius:18px;padding:28px 34px;box-shadow:0 12px 35px #34405b12;text-align:center}.spin{width:28px;height:28px;border:3px solid #e9ecff;border-top-color:#536dfe;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}.mut{color:#7d8492;font-size:13px}</style></head><body><div class="boot"><div class="box"><div class="spin"></div><b>正在加载个人秋招工作台</b><div class="mut">首次加载需要读取题库与界面资源，请稍候</div></div></div><script>
async function ungzip(url){const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw new Error(url+' '+r.status);const ds=new DecompressionStream('gzip');return await new Response(r.body.pipeThrough(ds)).text();}
(async()=>{try{const [shell,css,data,app]=await Promise.all([ungzip('core/shell.html.gz'),ungzip('core/style.css.gz'),ungzip('core/data.js.gz'),ungzip('core/app.js.gz')]);const safe=s=>s.replace(/<\/script/gi,'<\\/script');let html=shell.replace('</head>','<style>'+css+'</style></head>').replace('</body>','<script>'+safe(data)+'<\/script><script>'+safe(app)+'<\/script></body>');document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="boot"><div class="box"><b>加载失败</b><div class="mut">'+String(e)+'</div><button onclick="location.reload()" style="margin-top:14px;padding:8px 16px">重试</button></div></div>';console.error(e);}})();
</script></body></html>
